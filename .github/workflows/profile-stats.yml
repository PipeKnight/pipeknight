name: Update profile statistics

on:
  push:
    branches: [main]
    paths: [.github/workflows/profile-stats.yml]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CORE_VERSION: '2.3.1'
      STATS_OPTIONS: 'custom_title=GitHub+activity&show_icons=true&include_all_commits=true&show=prs_merged,prs_merged_percentage,prs_reviewed&rank_icon=github&card_width=500&line_height=23&number_format=long&disable_animations=true'
      LANGUAGE_OPTIONS: 'custom_title=Top+languages&layout=compact&card_width=500&langs_count=8&hide=html,Batchfile,Jupyter%20Notebook,PowerShell&disable_animations=true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate activity card for dark mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: ${{ env.STATS_OPTIONS }}&theme=tokyonight&border_color=343b58
          path: profile/stats-dark.svg
          core_version: ${{ env.CORE_VERSION }}
          fail_on_error: 'true'

      - name: Generate activity card for light mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: ${{ env.STATS_OPTIONS }}&theme=light_github
          path: profile/stats-light.svg
          core_version: ${{ env.CORE_VERSION }}
          fail_on_error: 'true'

      - name: Generate languages card for dark mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: ${{ env.LANGUAGE_OPTIONS }}&theme=tokyonight&border_color=343b58
          path: profile/languages-dark.svg
          core_version: ${{ env.CORE_VERSION }}
          fail_on_error: 'true'

      - name: Generate languages card for light mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: ${{ env.LANGUAGE_OPTIONS }}&theme=light_github
          path: profile/languages-light.svg
          core_version: ${{ env.CORE_VERSION }}
          fail_on_error: 'true'

      # Publish all four cards together after every render succeeds.
      - name: Publish cards
        run: |
          git add -- profile/{stats,languages}-{dark,light}.svg
          if git diff --cached --quiet && [ -f profile/last-published-at.txt ]; then
            # Scheduled runs alone do not prevent GitHub's 60-day inactivity timeout.
            now=$(date +%s)
            last_commit=$(git log -1 --format=%ct)
            if (( now - last_commit < 30 * 24 * 60 * 60 )); then
              exit 0
            fi
          fi

          date -u +'%Y-%m-%dT%H:%M:%SZ' > profile/last-published-at.txt
          git add -- profile/last-published-at.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile statistics'
          git push origin HEAD:refs/heads/main
